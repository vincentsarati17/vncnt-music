# XcodeGen spec: the .xcodeproj is GENERATED (never committed) via
# `xcodegen generate`, locally on a Mac or in CI. Keeps the repo free of
# fragile hand-written pbxproj XML.
name: VncntMusic
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  VncntMusic:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        # Continue playback with the screen locked / app backgrounded.
        UIBackgroundModes: [audio]
    frameworks:
      - path: ../core/build/bin/iosSimulatorArm64/debugFramework/VncntMusicCore.framework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vncnt.music
        CODE_SIGNING_ALLOWED: "NO"
        MARKETING_VERSION: "1.0.0"
        # XcodeGen links + embeds the vendored framework but does not put it
        # on Swift's module search path — without this, `import VncntMusicCore`
        # fails with "unable to resolve module dependency".
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../core/build/bin/iosSimulatorArm64/debugFramework"]
schemes:
  VncntMusic:
    build:
      targets:
        VncntMusic: all
    run:
      config: Debug
