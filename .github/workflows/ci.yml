# CI on macOS runners: the only Mac you need.
# - Verifies shared :core on JVM + iOS simulator (catches expect/actual and
#   Native-incompatible APIs that Windows cannot compile at all).
# - Verifies :app unit tests + debug APK (Android SDK installed below).
# No Apple Developer account needed: simulator builds require no signing.
# NOTE: repo has no gradlew yet — run `gradle wrapper --gradle-version 9.3.1`
# once locally and commit the result before pushing (see README checklist).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # macOS runners preinstall the SDK here; no third-party action needed
      # (android-actions/setup-android fails on current images).
      ANDROID_HOME: /Users/runner/Library/Android/sdk
      ANDROID_SDK_ROOT: /Users/runner/Library/Android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform + build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Shared tests (JVM)
        run: ./gradlew :core:jvmTest --console=plain

      - name: Shared tests (iOS simulator)
        run: ./gradlew :core:iosSimulatorArm64Test --console=plain

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      # Ephemeral runners vanish with their logs: persist test XML/HTML so
      # failures (especially iOS simulator ones) stay debuggable.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/

  ios-shell:
    # True iOS shell: shared framework + generated Xcode project + simulator
    # build. Runs in parallel with verify (separate runner, same billable pool).
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /Users/runner/Library/Android/sdk
      ANDROID_SDK_ROOT: /Users/runner/Library/Android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Install Android platform + build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build shared framework (simulator)
        run: ./gradlew :core:linkDebugFrameworkIosSimulatorArm64 --console=plain

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build iOS shell (simulator)
        run: |
          cd iosApp && xcodebuild -scheme VncntMusic -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO build
